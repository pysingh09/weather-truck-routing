# Render's free plan sleeps after 15 min idle; ping the API so reviewers don't hit a ~50 s cold start.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://weather-truck-routing-api.onrender.com/api/health
