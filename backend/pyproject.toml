[project]
name = "weather-truck-routing-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.18",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
